name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  # Lint and validate Python code
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit boto3

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Security scan with Bandit
        run: |
          bandit -r voting-backend/ result-backend/ vote-processor/ -f json -o bandit-report.json || true
        continue-on-error: true

  # Validate Terraform
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: ./iac
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: ./iac
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./iac
        run: terraform validate

  # Validate CloudFormation
  cloudformation-validate:
    name: CloudFormation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://iac/cloudformation/myvote_cf.yaml || true
        continue-on-error: true

  # Test Lambda functions
  test-lambdas:
    name: Test Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest moto

      - name: Run tests
        run: |
          # Add tests when available
          echo "Tests would run here"
        continue-on-error: true

  # Security scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [python-lint, terraform-validate, cloudformation-validate, test-lambdas]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Python Linting: ${{ needs.python-lint.result }}"
          echo "Terraform Validation: ${{ needs.terraform-validate.result }}"
          echo "CloudFormation Validation: ${{ needs.cloudformation-validate.result }}"
          echo "Lambda Tests: ${{ needs.test-lambdas.result }}"

      - name: Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validation checks completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "- Python Linting: ${{ needs.python-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform: ${{ needs.terraform-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFormation: ${{ needs.cloudformation-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lambda Tests: ${{ needs.test-lambdas.result }}" >> $GITHUB_STEP_SUMMARY
